name: Protect synced paths

# skills/, plugin skill mirrors (plugins/*/skills/), index.json,
# skills.sh.json, and provenance.json are generated by Ramp's publishing pipeline.
# This check fails any human PR that touches those paths, so hand edits
# never race the sync. The Ramp Skills publishing bot is exempt.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  protect-synced-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Skip for sync bot
        id: actor
        env:
          SYNC_BOT_ACTOR: ramp-skills[bot]
        run: |
          if [ -n "$SYNC_BOT_ACTOR" ] && [ "${{ github.actor }}" = "$SYNC_BOT_ACTOR" ]; then
            echo "is_sync_bot=true" >> "$GITHUB_OUTPUT"
            echo "Actor '${{ github.actor }}' is the sync bot; skipping synced-path protection."
          else
            echo "is_sync_bot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out PR merge ref
        if: steps.actor.outputs.is_sync_bot != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if synced paths were modified
        if: steps.actor.outputs.is_sync_bot != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_SHA:provenance.json" 2>/dev/null; then
            echo "Initial catalog publication; generated-path protection starts after this PR."
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- 'skills/**' 'plugins/*/skills/**' index.json skills.sh.json provenance.json)"
          if [ -n "$changed" ]; then
            echo "::error::This PR modifies synced catalog content, which is read-only in this repo:"
            echo "$changed" | sed 's/^/  - /'
            echo ""
            echo "skills/, plugins/*/skills/, index.json, skills.sh.json, and provenance.json are maintained by Ramp's publishing pipeline."
            echo "Open an issue in this repository to propose a skill change."
            exit 1
          fi
          echo "No synced paths modified."
